[project]
name = "ruoyi-fastapi"
version = "0.1.0"
description = "FastAPI 后台管理系统（若依 Python 版）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic-settings>=2.15.0",
    "pymysql>=1.2.3",
    "redis>=5.0.0",
    "orjson>=3.10.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "captcha>=0.5.0",
    "openpyxl>=3.1.0",
    "slowapi>=0.1.9",
    "bleach>=6.0.0",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
    "httpx>=0.28.1",
    "user-agents>=2.2.0",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ruoyi_fastapi"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
